<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>LoLOS 27 — Тест Dynamic Island</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #1a1a2e;
    color: #fff;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .island {
    position: fixed;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 34px;
    background: #000;
    border-radius: 24px;
    transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6);
  }
  .island.active {
    width: 340px;
    height: 90px;
    border-radius: 30px;
    background: #000;
    box-shadow: 0 8px 40px rgba(123, 94, 167, 0.4);
  }
  .island.expanded {
    width: 90%;
    max-width: 420px;
    height: auto;
    min-height: 120px;
    border-radius: 32px;
    padding: 16px;
    display: block;
  }
  .island-glow {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, #7b5ea7, #feca57, #7b5ea7);
    background-size: 300% 100%;
    animation: wave 3s ease infinite;
    opacity: 0;
    transition: opacity 0.4s;
    filter: blur(8px);
    z-index: -1;
  }
  .island.active .island-glow,
  .island.expanded .island-glow {
    opacity: 0.5;
  }
  @keyframes wave {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .island-content {
    display: none;
    position: relative;
    z-index: 2;
  }
  .island.expanded .island-content {
    display: block;
  }
  .status-text {
    font-size: 0.85rem;
    color: #aaa;
    margin-bottom: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .response-text {
    font-size: 1rem;
    line-height: 1.5;
    color: #fff;
  }
  .main {
    text-align: center;
    padding: 20px;
    max-width: 400px;
  }
  .device-info {
    background: rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 20px;
    font-size: 0.85rem;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .device-info .label { opacity: 0.5; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; }
  .device-info .value { font-size: 1rem; font-weight: 600; margin-top: 2px; }
  .device-info .value.supported { color: #4CAF50; }
  .device-info .value.unsupported { color: #ff6b6b; }
  .device-info .value.unknown { color: #feca57; }
  button {
    background: #7b5ea7;
    color: white;
    border: none;
    padding: 16px 28px;
    border-radius: 16px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    margin-bottom: 10px;
    transition: all 0.3s;
  }
  button:active { transform: scale(0.97); }
  button.secondary {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
  }
  .hint {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.35);
    margin-top: 12px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<!-- Dynamic Island -->
<div class="island" id="island">
  <div class="island-glow"></div>
  <div class="island-content" id="islandContent">
    <div class="status-text" id="islandStatus">Слушаю...</div>
    <div class="response-text" id="islandResponse"></div>
  </div>
</div>

<!-- Main UI -->
<div class="main">
  <h2 style="margin-bottom:16px; font-size:1.2rem;">🌊 LoLOS 27 — Liquid Loll</h2>
  <p style="opacity:0.5; font-size:0.8rem; margin-bottom:20px;">Тест Dynamic Island ассистента</p>

  <div class="device-info">
    <div class="label">Твоё устройство</div>
    <div class="value unknown" id="deviceModel">Определяю...</div>
    <div style="font-size:0.7rem; opacity:0.4; margin-top:8px;" id="deviceDetails"></div>
  </div>

  <button id="enableBtn" onclick="enableMotion()">📳 Включить вызов ассистента</button>
  <button id="disableBtn" class="secondary" onclick="disableMotion()" style="display:none;">✖ Отключить</button>

  <div class="hint" id="hintText">
    Нажми кнопку и разреши доступ к датчикам движения.
  </div>
</div>

<script>
// ============================================================
// 1. ОПРЕДЕЛЕНИЕ МОДЕЛИ (по размерам экрана)
// ============================================================
const screenW = window.screen.width;
const screenH = window.screen.height;
const dpr = window.devicePixelRatio || 1;

// Список размеров экранов iPhone 14 Pro и новее (в CSS пикселях)
// iPhone 14 Pro / 15 / 15 Pro / 16 / 16 Pro: 393 x 852
// iPhone 14 Pro Max / 15 Pro Max / 16 Pro Max: 430 x 932
// iPhone 16e (не поддерживается): 390 x 844 (как iPhone 13/14)
function detectDevice() {
  const isIPhone = /iPhone/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!isIPhone) {
    return { model: 'Не iPhone', supported: false, reason: 'Функция только для iPhone' };
  }

  // Проверяем размеры экрана
  const sizes = [
    { w: 393, h: 852, name: 'iPhone 14 Pro / 15 / 15 Pro / 16 / 16 Pro', supported: true },
    { w: 430, h: 932, name: 'iPhone 14 Pro Max / 15 Pro Max / 16 Pro Max', supported: true },
    { w: 390, h: 844, name: 'iPhone 16e (не поддерживается)', supported: false },
    { w: 375, h: 812, name: 'iPhone X / XS / 11 Pro / 12 mini / 13 mini', supported: false },
    { w: 414, h: 896, name: 'iPhone XR / 11 / 11 Pro Max', supported: false },
    { w: 428, h: 926, name: 'iPhone 12 Pro Max / 13 Pro Max / 14 Plus', supported: false },
    { w: 390, h: 844, name: 'iPhone 12 / 12 Pro / 13 / 13 Pro / 14', supported: false },
  ];

  for (let s of sizes) {
    if (screenW === s.w && screenH === s.h) {
      return { model: s.name, supported: s.supported, w: s.w, h: s.h, dpr };
    }
  }

  return { model: 'Неизвестная модель', supported: false, reason: `Размер экрана ${screenW}x${screenH}`, w: screenW, h: screenH, dpr };
}

// ============================================================
// 2. ЗАПРОС ДОСТУПА К ДАТЧИКАМ (DeviceMotion)
// ============================================================
let motionEnabled = false;
let shakeDetected = false;
let lastX = 0, lastY = 0, lastZ = 0;
let shakeThreshold = 15; // чувствительность
let lastShakeTime = 0;

async function enableMotion() {
  // Проверяем поддержку
  if (typeof DeviceMotionEvent === 'undefined') {
    updateHint('❌ Твой браузер не поддерживает датчики движения');
    return;
  }

  // iOS 13+ требует явного разрешения
  if (typeof DeviceMotionEvent.requestPermission === 'function') {
    try {
      const permission = await DeviceMotionEvent.requestPermission();
      if (permission !== 'granted') {
        updateHint('❌ Доступ к датчикам отклонён. Разреши в Настройках Safari: Настройки → Safari → Движение и ориентация');
        return;
      }
    } catch (e) {
      updateHint('❌ Ошибка запроса: ' + e.message);
      return;
    }
  }

  // Начинаем слушать
  window.addEventListener('devicemotion', onMotion);
  motionEnabled = true;
  document.getElementById('enableBtn').style.display = 'none';
  document.getElementById('disableBtn').style.display = 'block';
  updateHint('✅ Датчики активны! Тряхни телефон для вызова ассистента.');
}

function disableMotion() {
  window.removeEventListener('devicemotion', onMotion);
  motionEnabled = false;
  document.getElementById('enableBtn').style.display = 'block';
  document.getElementById('disableBtn').style.display = 'none';
  closeIsland();
  updateHint('Датчики отключены.');
}

function onMotion(event) {
  if (!motionEnabled) return;

  const acc = event.accelerationIncludingGravity;
  if (!acc) return;

  const x = acc.x || 0, y = acc.y || 0, z = acc.z || 0;
  const deltaX = Math.abs(x - lastX);
  const deltaY = Math.abs(y - lastY);
  const deltaZ = Math.abs(z - lastZ);
  const delta = deltaX + deltaY + deltaZ;

  lastX = x; lastY = y; lastZ = z;

  if (delta > shakeThreshold) {
    const now = Date.now();
    if (now - lastShakeTime > 1500) { // антидребезг
      lastShakeTime = now;
      onShake();
    }
  }
}

// ============================================================
// 3. ЛОГИКА АССИСТЕНТА (Dynamic Island)
// ============================================================
function onShake() {
  if (shakeDetected) return;
  shakeDetected = true;
  openIsland('📳 Тряска обнаружена! Слушаю...');
  startVoiceRecognition();
}

function openIsland(text) {
  const island = document.getElementById('island');
  const content = document.getElementById('islandContent');
  const status = document.getElementById('islandStatus');
  const response = document.getElementById('islandResponse');

  island.classList.add('active');
  status.textContent = 'Слушаю...';
  response.textContent = text;

  setTimeout(() => {
    island.classList.add('expanded');
  }, 200);
}

function closeIsland() {
  const island = document.getElementById('island');
  island.classList.remove('expanded');
  island.classList.remove('active');
  shakeDetected = false;
}

function updateHint(text) {
  document.getElementById('hintText').textContent = text;
}

// ============================================================
// 4. РАСПОЗНАВАНИЕ РЕЧИ (с fallback)
// ============================================================
async function startVoiceRecognition() {
  // Пробуем Web Speech API
  if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'ru-RU';
    recognition.interimResults = false;
    recognition.continuous = false;

    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript;
      document.getElementById('islandStatus').textContent = 'Обрабатываю...';
      document.getElementById('islandResponse').textContent = 'Ты сказал: ' + transcript;
      // TODO: отправить в Groq API
      setTimeout(closeIsland, 4000);
    };

    recognition.onerror = (event) => {
      document.getElementById('islandResponse').textContent = '❌ Ошибка распознавания: ' + event.error;
      setTimeout(closeIsland, 3000);
    };

    recognition.onend = () => {
      // Если ничего не распознали — закрываем
      setTimeout(() => {
        if (shakeDetected) {
          document.getElementById('islandResponse').textContent = '🤔 Ничего не услышал';
          setTimeout(closeIsland, 2000);
        }
      }, 500);
    };

    try {
      recognition.start();
    } catch (e) {
      document.getElementById('islandResponse').textContent = '❌ Не удалось запустить микрофон';
      setTimeout(closeIsland, 2000);
    }
  } else {
    document.getElementById('islandResponse').textContent = '❌ Браузер не поддерживает распознавание речи';
    setTimeout(closeIsland, 3000);
  }
}

// ============================================================
// 5. ИНИЦИАЛИЗАЦИЯ
// ============================================================
window.addEventListener('load', () => {
  const info = detectDevice();
  const modelEl = document.getElementById('deviceModel');
  const detailsEl = document.getElementById('deviceDetails');

  modelEl.textContent = info.model;
  modelEl.className = 'value ' + (info.supported ? 'supported' : (info.model.includes('Не iPhone') || info.model.includes('Неизвест') ? 'unknown' : 'unsupported'));

  detailsEl.textContent = `${info.w || screenW}x${info.h || screenH} @ ${info.dpr || dpr}x`;

  if (!info.supported) {
    updateHint('⚠️ Твоё устройство не поддерживает вызов ассистента через Dynamic Island. Функция доступна только на iPhone 14 Pro и новее (кроме 16e).');
  }
});
</script>
</body>
</html>
