<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>LoLOS 27 — Liquid Loll</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: #000;
    height: 100%;
    width: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ============================================================
     РАМКА — скруглённые углы, переливается
     ============================================================ */
  .frame {
    position: fixed;
    inset: 8px;
    border-radius: 48px;
    pointer-events: none;
    z-index: 9999;
    opacity: 0;
    transition: opacity 0.5s ease;
    padding: 5px;
  }

  .frame.active {
    opacity: 1;
  }

  .frame::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 48px;
    background: linear-gradient(
      90deg,
      #4a90e2 0%,
      #6b4ee6 20%,
      #a78bfa 40%,
      #feca57 60%,
      #ff9a56 80%,
      #4a90e2 100%
    );
    background-size: 300% 100%;
    animation: frameGradient 5s linear infinite;
    -webkit-mask:
      linear-gradient(#fff 0 0) content-box,
      linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    box-shadow:
      0 0 30px rgba(107, 78, 230, 0.5),
      0 0 60px rgba(167, 139, 250, 0.3);
  }

  @keyframes frameGradient {
    0%   { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .frame.speaking::before {
    box-shadow:
      0 0 60px rgba(167, 139, 250, 0.8),
      0 0 100px rgba(167, 139, 250, 0.5);
  }

  /* ============================================================
     ЛОГОТИП
     ============================================================ */
  .center-logo {
    text-align: center;
    transition: opacity 0.4s, transform 0.4s;
    padding: 0 30px;
  }

  .center-logo.hidden {
    opacity: 0;
    transform: scale(0.9);
  }

  .logo {
    font-size: 2.8rem;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #a78bfa, #feca57);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 0.75rem;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 32px;
  }

  .instruction {
    font-size: 0.9rem;
    color: rgba(255,255,255,0.55);
    line-height: 1.6;
  }

  .instruction .emoji {
    font-size: 2.2rem;
    display: block;
    margin-bottom: 12px;
    animation: shakeEmoji 1.5s ease-in-out infinite;
  }

  @keyframes shakeEmoji {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-15deg); }
    75% { transform: rotate(15deg); }
  }

  .start-btn {
    margin-top: 28px;
    padding: 16px 36px;
    background: linear-gradient(135deg, #6b4ee6, #a78bfa);
    color: #fff;
    border: none;
    border-radius: 18px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 8px 30px rgba(107, 78, 230, 0.5);
    transition: all 0.3s;
  }

  .start-btn:active { transform: scale(0.96); }
  .start-btn.hidden { display: none; }

  /* ============================================================
     ИНДИКАТОР "СЛУШАЮ"
     ============================================================ */
  .listening-indicator {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 30px);
    left: 50%;
    transform: translate(-50%, -20px);
    background: rgba(20, 20, 40, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(107, 78, 230, 0.4);
    border-radius: 30px;
    padding: 10px 22px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.9);
    z-index: 10000;
    opacity: 0;
    transition: all 0.4s ease;
    pointer-events: none;
  }

  .listening-indicator.active {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .listening-dot {
    width: 10px;
    height: 10px;
    background: #a78bfa;
    border-radius: 50%;
    animation: listeningPulse 1s ease-in-out infinite;
  }

  @keyframes listeningPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(167, 139, 250, 0.6); }
    50% { box-shadow: 0 0 0 8px rgba(167, 139, 250, 0); }
  }

  /* ============================================================
     НИЖНЯЯ ПАНЕЛЬ
     ============================================================ */
  .bottom-panel {
    position: fixed;
    left: 20px;
    right: 20px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 30px);
    z-index: 10001;
    display: flex;
    flex-direction: column;
    gap: 10px;
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events: none;
  }

  .bottom-panel.active {
    opacity: 1;
    transform: translateY(0);
  }

  .bubble {
    background: rgba(20, 20, 40, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 14px 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    animation: bubbleIn 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
  }

  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .bubble .label {
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .bubble .text {
    font-size: 1rem;
    line-height: 1.45;
    color: #fff;
    word-wrap: break-word;
  }

  .bubble.user { border: 1px solid rgba(167, 139, 250, 0.4); }
  .bubble.user .label { color: rgba(167, 139, 250, 1); }

  .bubble.bot { border: 1px solid rgba(254, 202, 87, 0.35); }
  .bubble.bot .label { color: rgba(254, 202, 87, 0.9); }

  .typing {
    display: inline-flex;
    gap: 5px;
    align-items: center;
    padding: 4px 0;
  }
  .typing span {
    width: 7px;
    height: 7px;
    background: rgba(167, 139, 250, 0.8);
    border-radius: 50%;
    animation: typing 1.2s ease-in-out infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* ============================================================
     РУЧНОЙ ВВОД
     ============================================================ */
  .manual-wrap {
    position: fixed;
    left: 20px;
    right: 20px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 30px);
    z-index: 10002;
    display: none;
    gap: 8px;
  }

  .manual-wrap.active {
    display: flex;
  }

  .manual-wrap input {
    flex: 1;
    padding: 14px 16px;
    border-radius: 16px;
    border: 1px solid rgba(107, 78, 230, 0.5);
    background: rgba(20, 20, 40, 0.95);
    color: #fff;
    font-size: 1rem;
    font-family: inherit;
    outline: none;
  }

  .manual-wrap input:focus { border-color: #a78bfa; }

  .manual-wrap button {
    padding: 0 22px;
    border-radius: 16px;
    border: none;
    background: linear-gradient(135deg, #6b4ee6, #a78bfa);
    color: #fff;
    font-size: 1.2rem;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>

<div class="frame" id="frame"></div>

<div class="listening-indicator" id="listeningIndicator">
  <div class="listening-dot"></div>
  <span>Слушаю...</span>
</div>

<div class="center-logo" id="centerLogo">
  <div class="logo">LoLOS 27</div>
  <div class="subtitle">Liquid Loll</div>
  <div class="instruction">
    <span class="emoji">📳</span>
    Нажми кнопку, разреши доступ к датчикам<br>и тряхни телефон
  </div>
  <button class="start-btn" id="startBtn" onclick="enableMotion()">
    📳 Активировать
  </button>
</div>

<div class="bottom-panel" id="bottomPanel">
  <div class="bubble user" id="userBubble" style="display:none;">
    <div class="label">🎤 Ты сказал</div>
    <div class="text" id="userText"></div>
  </div>
  <div class="bubble bot" id="botBubble" style="display:none;">
    <div class="label">🛒 LoLi</div>
    <div class="text" id="botText"></div>
  </div>
</div>

<div class="manual-wrap" id="manualWrap">
  <input type="text" id="manualInput" placeholder="Напиши здесь...">
  <button onclick="sendManual()">➤</button>
</div>

<script>
  // ============================================================
  // СОСТОЯНИЕ
  // ============================================================
  var motionEnabled = false;
  var isProcessing = false;
  var lastX = 0, lastY = 0, lastZ = 0;
  var lastShakeTime = 0;
  var SHAKE_THRESHOLD = 18;

  // Глобальные переменные для управления распознаванием
  var activeRecognition = null;
  var silenceTimer = null;
  var responseTimer = null;
  var closeTimer = null;

  // ============================================================
  // АКТИВАЦИЯ ДАТЧИКОВ
  // ============================================================
  async function enableMotion() {
    var btn = document.getElementById('startBtn');

    if (typeof DeviceMotionEvent === 'undefined') {
      btn.textContent = '❌ Датчики недоступны';
      return;
    }

    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      try {
        var permission = await DeviceMotionEvent.requestPermission();
        if (permission !== 'granted') {
          btn.textContent = '❌ Доступ отклонён';
          return;
        }
      } catch (e) {
        btn.textContent = '❌ Ошибка: ' + e.message;
        return;
      }
    }

    window.addEventListener('devicemotion', onMotion);
    motionEnabled = true;
    btn.classList.add('hidden');

    var logo = document.getElementById('centerLogo');
    logo.querySelector('.instruction').innerHTML =
      '<span class="emoji">✅</span>Датчики активны!<br>Тряхни телефон';
  }

  // ============================================================
  // ДЕТЕКТ ТРЯСКИ
  // ============================================================
  function onMotion(event) {
    if (!motionEnabled || isProcessing) return;

    var acc = event.accelerationIncludingGravity;
    if (!acc) return;

    var x = acc.x || 0, y = acc.y || 0, z = acc.z || 0;
    var delta = Math.abs(x - lastX) + Math.abs(y - lastY) + Math.abs(z - lastZ);
    lastX = x; lastY = y; lastZ = z;

    if (delta > SHAKE_THRESHOLD) {
      var now = Date.now();
      if (now - lastShakeTime > 2000) {
        lastShakeTime = now;
        triggerAssistant();
      }
    }
  }

  // ============================================================
  // ЗАПУСК АССИСТЕНТА — СБРАСЫВАЕМ ВСЁ И НАЧИНАЕМ ЗАНОВО
  // ============================================================
  function triggerAssistant() {
    if (isProcessing) return;
    isProcessing = true;

    // Сбрасываем предыдущее состояние
    resetRecognition();
    clearAllTimers();

    // Показываем рамку
    document.getElementById('frame').classList.add('active');

    // Прячем логотип
    document.getElementById('centerLogo').classList.add('hidden');

    // Показываем "Слушаю"
    document.getElementById('listeningIndicator').classList.add('active');

    // Очищаем панель
    document.getElementById('bottomPanel').classList.remove('active');
    document.getElementById('userBubble').style.display = 'none';
    document.getElementById('botBubble').style.display = 'none';
    document.getElementById('botText').innerHTML = '';

    // Прячем ручной ввод, если был
    document.getElementById('manualWrap').classList.remove('active');

    // Небольшая задержка перед стартом — чтобы DOM обновился
    setTimeout(function() {
      startRecognition();
    }, 300);
  }

  // ============================================================
  // СБРОС ПРЕДЫДУЩЕГО РАСПОЗНАВАНИЯ
  // ============================================================
  function resetRecognition() {
    if (activeRecognition) {
      try {
        activeRecognition.abort();
        activeRecognition.stop();
      } catch (e) {}
      activeRecognition = null;
    }
    if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
    if (responseTimer) { clearTimeout(responseTimer); responseTimer = null; }
    if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
  }

  function clearAllTimers() {
    if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
    if (responseTimer) { clearTimeout(responseTimer); responseTimer = null; }
    if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
  }

  // ============================================================
  // РАСПОЗНАВАНИЕ РЕЧИ — НОВЫЙ ЭКЗЕМПЛЯР КАЖДЫЙ РАЗ
  // ============================================================
  function startRecognition() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SR) {
      showManualInput('⚠️ Микрофон недоступен. Напиши текстом.');
      return;
    }

    // ВАЖНО: создаём НОВЫЙ экземпляр каждый раз
    activeRecognition = new SR();
    activeRecognition.lang = 'ru-RU';
    activeRecognition.interimResults = false;
    activeRecognition.continuous = false;
    activeRecognition.maxAlternatives = 1;

    var gotResult = false;

    // Таймер тишины — 10 секунд
    silenceTimer = setTimeout(function() {
      if (!gotResult) {
        try { activeRecognition.stop(); } catch (e) {}
        showManualInput('🤔 Ничего не услышал. Напиши текстом.');
      }
    }, 10000);

    activeRecognition.onresult = function(event) {
      gotResult = true;
      if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
      var transcript = event.results[0][0].transcript;
      handleUserSpeech(transcript);
    };

    activeRecognition.onerror = function(event) {
      if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }

      // Игнорируем ошибку "aborted" — это мы сами прервали
      if (event.error === 'aborted') return;

      if (event.error === 'not-allowed') {
        showManualInput('⚠️ Нет доступа к микрофону. Напиши текстом.');
      } else if (event.error === 'service-not-allowed') {
        showManualInput('⚠️ Сервис распознавания недоступен. Напиши текстом.');
      } else if (event.error === 'no-speech') {
        showManualInput('🤔 Ничего не услышал. Напиши текстом.');
      } else {
        showManualInput('❌ Ошибка: ' + event.error + '. Напиши текстом.');
      }
    };

    activeRecognition.onend = function() {
      if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
      if (!gotResult && isProcessing) {
        showManualInput('🤔 Не расслышал. Напиши текстом.');
      }
    };

    try {
      activeRecognition.start();
      console.log('🎤 Микрофон запущен (новый экземпляр)');
    } catch (e) {
      console.error('❌ Ошибка запуска микрофона:', e);
      showManualInput('❌ Не удалось запустить микрофон. Напиши текстом.');
    }
  }

  // ============================================================
  // ОБРАБОТКА ГОЛОСА
  // ============================================================
  function handleUserSpeech(text) {
    document.getElementById('listeningIndicator').classList.remove('active');

    document.getElementById('userText').textContent = text;
    document.getElementById('userBubble').style.display = 'block';
    document.getElementById('bottomPanel').classList.add('active');

    responseTimer = setTimeout(showBotTyping, 400);

    setTimeout(function() {
      showBotResponse(text);
    }, 1800);
  }

  function showBotTyping() {
    var botBubble = document.getElementById('botBubble');
    var botText = document.getElementById('botText');
    botBubble.style.display = 'block';
    botText.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  }

  function showBotResponse(userSaid) {
    var answer = generateAnswer(userSaid);
    document.getElementById('botText').textContent = answer;

    var frame = document.getElementById('frame');
    frame.classList.add('speaking');

    speak(answer);

    setTimeout(function() {
      frame.classList.remove('speaking');
    }, 3000);

    closeTimer = setTimeout(closeAll, 6000);
  }

  // ============================================================
  // ГЕНЕРАТОР ОТВЕТА
  // ============================================================
  function generateAnswer(userText) {
    var t = userText.toLowerCase();

    if (t.indexOf('привет') !== -1 || t.indexOf('здравствуй') !== -1) {
      return 'Привет! 🛒 Я LoLi. Чем могу помочь?';
    }
    if (t.indexOf('как дела') !== -1 || t.indexOf('как ты') !== -1) {
      return 'Отлично! Всегда рада помочь 😊';
    }
    if (t.indexOf('время') !== -1 || t.indexOf('час') !== -1) {
      var now = new Date();
      return 'Сейчас ' + now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');
    }
    if (t.indexOf('погод') !== -1) {
      return 'К сожалению, погоду пока не умею показывать 🌤️';
    }
    if (t.indexOf('имя') !== -1 || t.indexOf('как тебя') !== -1) {
      return 'Меня зовут LoLi! 🛒 Я твой ассистент в LoLOS 27.';
    }
    if (t.indexOf('спасибо') !== -1) {
      return 'Всегда пожалуйста! 😊';
    }
    if (t.indexOf('пока') !== -1 || t.indexOf('до свидания') !== -1) {
      return 'Пока! Буду ждать следующего вызова 👋';
    }

    var answers = [
      'Понял тебя! Говоришь: "' + userText + '". Чем ещё помочь?',
      'Интересно! Расскажи подробнее 🤔',
      'Я тебя услышала: "' + userText + '"',
      'Принято! Что делаем дальше?'
    ];
    return answers[Math.floor(Math.random() * answers.length)];
  }

  // ============================================================
  // ОЗВУЧКА
  // ============================================================
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    try {
      window.speechSynthesis.cancel();
      var utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ru-RU';
      utterance.rate = 1.05;
      utterance.pitch = 1.1;
      utterance.volume = 1;
      window.speechSynthesis.speak(utterance);
    } catch (e) {}
  }

  // ============================================================
  // РУЧНОЙ ВВОД
  // ============================================================
  function showManualInput(message) {
    document.getElementById('listeningIndicator').classList.remove('active');
    var wrap = document.getElementById('manualWrap');
    wrap.classList.add('active');
    var input = document.getElementById('manualInput');
    input.placeholder = message || 'Напиши здесь...';
    setTimeout(function() { input.focus(); }, 100);
  }

  function sendManual() {
    var input = document.getElementById('manualInput');
    var text = input.value.trim();
    if (!text) return;
    input.value = '';
    document.getElementById('manualWrap').classList.remove('active');
    handleUserSpeech(text);
  }

  document.getElementById('manualInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') sendManual();
  });

  // ============================================================
  // ЗАКРЫТИЕ
  // ============================================================
  function closeAll() {
    // Сначала сбрасываем распознавание
    resetRecognition();

    document.getElementById('frame').classList.remove('active');
    document.getElementById('bottomPanel').classList.remove('active');
    document.getElementById('manualWrap').classList.remove('active');
    document.getElementById('listeningIndicator').classList.remove('active');
    document.getElementById('centerLogo').classList.remove('hidden');

    setTimeout(function() {
      document.getElementById('userBubble').style.display = 'none';
      document.getElementById('botBubble').style.display = 'none';
      document.getElementById('botText').innerHTML = '';

      // ВАЖНО: сбрасываем флаг, чтобы можно было запустить заново
      isProcessing = false;

      console.log('✅ Готов к следующему вызову');
    }, 400);
  }

  // Тап по экрану — закрыть
  document.addEventListener('click', function(e) {
    if (isProcessing && !e.target.closest('.manual-wrap') && !e.target.closest('.start-btn')) {
      closeAll();
    }
  });

  // Очистка при уходе со страницы
  window.addEventListener('beforeunload', function() {
    resetRecognition();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
  });

  console.log('🌊 LoLOS 27 — Liquid Loll');
  console.log('✅ Готов к многократным вызовам');
</script>
</body>
</html>
