<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<title>LoLOS 27 — Liquid Loll</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: #0f0f1a;
    height: 100%;
    width: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ============================================================
     РАМКА — сине-фиолетовая подсветка при тряске
     ============================================================ */
  .frame {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .frame.active {
    opacity: 1;
  }

  /* Свечение по краям */
  .frame::before {
    content: '';
    position: absolute;
    inset: 0;
    box-shadow:
      inset 0 0 0 4px #6b4ee6,
      inset 0 0 40px rgba(107, 78, 230, 0.6),
      inset 0 0 100px rgba(107, 78, 230, 0.3);
    border-radius: 12px;
    animation: framePulse 2s ease-in-out infinite;
  }

  /* Внешнее свечение */
  .frame::after {
    content: '';
    position: absolute;
    inset: -20px;
    background: radial-gradient(ellipse at center,
      transparent 60%,
      rgba(107, 78, 230, 0.3) 100%);
    filter: blur(20px);
    animation: framePulse 2s ease-in-out infinite;
  }

  @keyframes framePulse {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }

  /* Внутреннее свечение при разговоре (громкость) */
  .frame.speaking::before {
    box-shadow:
      inset 0 0 0 4px #a78bfa,
      inset 0 0 60px rgba(167, 139, 250, 0.8),
      inset 0 0 150px rgba(167, 139, 250, 0.4);
  }

  /* ============================================================
     ЦЕНТРАЛЬНЫЙ ЛОГОТИП (пока ничего не происходит)
     ============================================================ */
  .center-logo {
    text-align: center;
    transition: opacity 0.4s, transform 0.4s;
  }

  .center-logo.hidden {
    opacity: 0;
    transform: scale(0.9);
  }

  .logo {
    font-size: 2.8rem;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #a78bfa, #feca57);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 0.75rem;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 24px;
  }

  .instruction {
    font-size: 0.9rem;
    color: rgba(255,255,255,0.5);
    line-height: 1.6;
    padding: 0 30px;
  }

  .instruction .emoji {
    font-size: 2rem;
    display: block;
    margin-bottom: 10px;
    animation: shakeEmoji 1.5s ease-in-out infinite;
  }

  @keyframes shakeEmoji {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-15deg); }
    75% { transform: rotate(15deg); }
  }

  /* Кнопка запуска (нужна для разрешения датчиков) */
  .start-btn {
    margin-top: 24px;
    padding: 16px 32px;
    background: linear-gradient(135deg, #6b4ee6, #a78bfa);
    color: #fff;
    border: none;
    border-radius: 16px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 8px 30px rgba(107, 78, 230, 0.5);
    transition: all 0.3s;
  }

  .start-btn:active { transform: scale(0.96); }

  .start-btn.hidden { display: none; }

  /* ============================================================
     НИЖНЯЯ ПАНЕЛЬ — что сказал + ответ
     ============================================================ */
  .bottom-panel {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 10px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.4s ease, transform 0.4s ease;
    pointer-events: none;
  }

  .bottom-panel.active {
    opacity: 1;
    transform: translateY(0);
  }

  .bubble {
    background: rgba(20, 20, 40, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(107, 78, 230, 0.3);
    border-radius: 18px;
    padding: 14px 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    animation: bubbleIn 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
  }

  @keyframes bubbleIn {
    from { opacity: 0; transform: translateY(20px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .bubble .label {
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(167, 139, 250, 0.8);
    margin-bottom: 6px;
  }

  .bubble .text {
    font-size: 1rem;
    line-height: 1.4;
    color: #fff;
    word-wrap: break-word;
  }

  /* Пузырь "ты сказал" */
  .bubble.user {
    border-color: rgba(167, 139, 250, 0.4);
  }

  .bubble.user .label {
    color: rgba(167, 139, 250, 1);
  }

  /* Пузырь "ответ" */
  .bubble.bot {
    border-color: rgba(254, 202, 87, 0.3);
  }

  .bubble.bot .label {
    color: rgba(254, 202, 87, 0.9);
  }

  /* Точки "печатает" */
  .typing {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }
  .typing span {
    width: 6px;
    height: 6px;
    background: rgba(167, 139, 250, 0.8);
    border-radius: 50%;
    animation: typing 1.2s ease-in-out infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* Индикатор "слушаю" */
  .listening-indicator {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 20px);
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 20, 40, 0.85);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(107, 78, 230, 0.4);
    border-radius: 30px;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.85rem;
    color: rgba(255,255,255,0.8);
    z-index: 1001;
    opacity: 0;
    transform: translate(-50%, -20px);
    transition: all 0.4s ease;
    pointer-events: none;
  }

  .listening-indicator.active {
    opacity: 1;
    transform: translate(-50%, 0);
  }

  .listening-dot {
    width: 10px;
    height: 10px;
    background: #a78bfa;
    border-radius: 50%;
    animation: listeningPulse 1s ease-in-out infinite;
  }

  @keyframes listeningPulse {
    0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(167, 139, 250, 0.6); }
    50% { opacity: 0.6; transform: scale(1.2); box-shadow: 0 0 0 8px rgba(167, 139, 250, 0); }
  }

  /* Ручной ввод — фолбэк */
  .manual-wrap {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    z-index: 1001;
    display: none;
    gap: 8px;
  }

  .manual-wrap.active {
    display: flex;
  }

  .manual-wrap input {
    flex: 1;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid rgba(107, 78, 230, 0.4);
    background: rgba(20, 20, 40, 0.9);
    color: #fff;
    font-size: 1rem;
    font-family: inherit;
    outline: none;
  }

  .manual-wrap input:focus {
    border-color: #a78bfa;
  }

  .manual-wrap button {
    padding: 0 20px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, #6b4ee6, #a78bfa);
    color: #fff;
    font-size: 1.2rem;
    cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>

<!-- Рамка подсветки -->
<div class="frame" id="frame"></div>

<!-- Индикатор "слушаю" -->
<div class="listening-indicator" id="listeningIndicator">
  <div class="listening-dot"></div>
  <span>Слушаю...</span>
</div>

<!-- Центральный логотип -->
<div class="center-logo" id="centerLogo">
  <div class="logo">LoLOS 27</div>
  <div class="subtitle">Liquid Loll</div>
  <div class="instruction">
    <span class="emoji">📳</span>
    Нажми кнопку ниже, разреши доступ к датчикам и тряхни телефон
  </div>
  <button class="start-btn" id="startBtn" onclick="enableMotion()">
    📳 Активировать
  </button>
</div>

<!-- Нижняя панель: что сказал + ответ -->
<div class="bottom-panel" id="bottomPanel">
  <div class="bubble user" id="userBubble" style="display:none;">
    <div class="label">🎤 Ты сказал</div>
    <div class="text" id="userText"></div>
  </div>
  <div class="bubble bot" id="botBubble" style="display:none;">
    <div class="label">🛒 LoLi</div>
    <div class="text" id="botText"></div>
  </div>
</div>

<!-- Ручной ввод -->
<div class="manual-wrap" id="manualWrap">
  <input type="text" id="manualInput" placeholder="Напиши здесь...">
  <button onclick="sendManual()">➤</button>
</div>

<script>
  // ============================================================
  // СОСТОЯНИЕ
  // ============================================================
  var motionEnabled = false;
  var isProcessing = false;
  var lastX = 0, lastY = 0, lastZ = 0;
  var lastShakeTime = 0;
  var SHAKE_THRESHOLD = 18;

  // ============================================================
  // АКТИВАЦИЯ ДАТЧИКОВ
  // ============================================================
  async function enableMotion() {
    var btn = document.getElementById('startBtn');

    if (typeof DeviceMotionEvent === 'undefined') {
      btn.textContent = '❌ Датчики недоступны';
      return;
    }

    // iOS 13+ требует разрешение
    if (typeof DeviceMotionEvent.requestPermission === 'function') {
      try {
        var permission = await DeviceMotionEvent.requestPermission();
        if (permission !== 'granted') {
          btn.textContent = '❌ Доступ отклонён';
          return;
        }
      } catch (e) {
        btn.textContent = '❌ Ошибка: ' + e.message;
        return;
      }
    }

    window.addEventListener('devicemotion', onMotion);
    motionEnabled = true;

    btn.classList.add('hidden');

    var logo = document.getElementById('centerLogo');
    logo.querySelector('.instruction').innerHTML =
      '<span class="emoji">✅</span>Датчики активны!<br>Тряхни телефон';

    console.log('✅ Датчики активированы');
  }

  // ============================================================
  // ДЕТЕКТ ТРЯСКИ
  // ============================================================
  function onMotion(event) {
    if (!motionEnabled || isProcessing) return;

    var acc = event.accelerationIncludingGravity;
    if (!acc) return;

    var x = acc.x || 0, y = acc.y || 0, z = acc.z || 0;
    var delta = Math.abs(x - lastX) + Math.abs(y - lastY) + Math.abs(z - lastZ);
    lastX = x; lastY = y; lastZ = z;

    if (delta > SHAKE_THRESHOLD) {
      var now = Date.now();
      if (now - lastShakeTime > 2000) {
        lastShakeTime = now;
        triggerAssistant();
      }
    }
  }

  // ============================================================
  // ЗАПУСК АССИСТЕНТА
  // ============================================================
  function triggerAssistant() {
    if (isProcessing) return;
    isProcessing = true;

    // 1. Показываем сине-фиолетовую рамку
    document.getElementById('frame').classList.add('active');

    // 2. Прячем логотип
    document.getElementById('centerLogo').classList.add('hidden');

    // 3. Показываем индикатор "Слушаю"
    document.getElementById('listeningIndicator').classList.add('active');

    // 4. Очищаем панель
    document.getElementById('bottomPanel').classList.remove('active');
    document.getElementById('userBubble').style.display = 'none';
    document.getElementById('botBubble').style.display = 'none';

    // 5. Стартуем распознавание
    startRecognition();
  }

  // ============================================================
  // РАСПОЗНАВАНИЕ РЕЧИ
  // ============================================================
  function startRecognition() {
    // Проверяем поддержку
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SR) {
      // Нет поддержки — показываем ручной ввод
      showManualInput('⚠️ Микрофон недоступен. Напиши текстом.');
      return;
    }

    var recognition = new SR();
    recognition.lang = 'ru-RU';
    recognition.interimResults = false;
    recognition.continuous = false;
    recognition.maxAlternatives = 1;

    var gotResult = false;
    var silenceTimer = setTimeout(function() {
      // Если через 10 секунд ничего не услышали — предлагаем ручной ввод
      if (!gotResult) {
        try { recognition.stop(); } catch (e) {}
        showManualInput('🤔 Ничего не услышал. Напиши текстом.');
      }
    }, 10000);

    recognition.onresult = function(event) {
      gotResult = true;
      clearTimeout(silenceTimer);
      var transcript = event.results[0][0].transcript;
      handleUserSpeech(transcript);
    };

    recognition.onerror = function(event) {
      clearTimeout(silenceTimer);
      console.error('Ошибка распознавания:', event.error);

      if (event.error === 'not-allowed') {
        showManualInput('⚠️ Нет доступа к микрофону. Напиши текстом.');
      } else if (event.error === 'service-not-allowed') {
        showManualInput('⚠️ Сервис распознавания недоступен. Напиши текстом.');
      } else if (event.error === 'no-speech') {
        showManualInput('🤔 Ничего не услышал. Напиши текстом.');
      } else {
        showManualInput('❌ Ошибка: ' + event.error + '. Напиши текстом.');
      }
    };

    recognition.onend = function() {
      clearTimeout(silenceTimer);
      if (!gotResult) {
        // Ничего не распознали — показываем ручной ввод
        showManualInput('🤔 Не расслышал. Напиши текстом.');
      }
    };

    try {
      recognition.start();
      console.log('🎤 Слушаю...');
    } catch (e) {
      clearTimeout(silenceTimer);
      showManualInput('❌ Не удалось запустить микрофон. Напиши текстом.');
    }
  }

  // ============================================================
  // ОБРАБОТКА ГОЛОСА — показываем что сказал + отвечаем
  // ============================================================
  function handleUserSpeech(text) {
    // Убираем индикатор "Слушаю"
    document.getElementById('listeningIndicator').classList.remove('active');

    // Показываем, что сказал пользователь
    document.getElementById('userText').textContent = text;
    document.getElementById('userBubble').style.display = 'block';

    // Показываем панель
    document.getElementById('bottomPanel').classList.add('active');

    // Даём боту "подумать" и отвечаем
    setTimeout(function() {
      showBotTyping();
    }, 400);

    setTimeout(function() {
      showBotResponse(text);
    }, 1800);
  }

  // ============================================================
  // БОТ "ПЕЧАТАЕТ"
  // ============================================================
  function showBotTyping() {
    var botBubble = document.getElementById('botBubble');
    var botText = document.getElementById('botText');
    botBubble.style.display = 'block';
    botText.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  }

  // ============================================================
  // ОТВЕТ БОТА
  // ============================================================
  function showBotResponse(userSaid) {
    var answer = generateAnswer(userSaid);
    document.getElementById('botText').textContent = answer;

    // Небольшая анимация "говорит"
    var frame = document.getElementById('frame');
    frame.classList.add('speaking');

    // Озвучка (если поддерживается)
    speak(answer);

    setTimeout(function() {
      frame.classList.remove('speaking');
    }, 3000);

    // Через 6 секунд закрываем всё
    setTimeout(closeAll, 6000);
  }

  // ============================================================
  // ГЕНЕРАТОР ОТВЕТА (заглушка — можно подключить Groq/GigaChat)
  // ============================================================
  function generateAnswer(userText) {
    var t = userText.toLowerCase();

    if (t.indexOf('привет') !== -1 || t.indexOf('здравствуй') !== -1) {
      return 'Привет! 🛒 Я LoLi. Чем могу помочь?';
    }
    if (t.indexOf('как дела') !== -1 || t.indexOf('как ты') !== -1) {
      return 'Отлично! Всегда рада помочь 😊';
    }
    if (t.indexOf('время') !== -1 || t.indexOf('час') !== -1) {
      var now = new Date();
      return 'Сейчас ' + now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');
    }
    if (t.indexOf('погод') !== -1) {
      return 'К сожалению, погоду пока не умею показывать 🌤️';
    }
    if (t.indexOf('имя') !== -1 || t.indexOf('как тебя') !== -1) {
      return 'Меня зовут LoLi! 🛒 Я твой ассистент в LoLOS 27.';
    }
    if (t.indexOf('спасибо') !== -1) {
      return 'Всегда пожалуйста! 😊';
    }
    if (t.indexOf('пока') !== -1 || t.indexOf('до свидания') !== -1) {
      return 'Пока! Буду ждать следующего вызова 👋';
    }

    // По умолчанию
    var answers = [
      'Понял тебя! Говоришь: "' + userText + '". Чем ещё помочь?',
      'Интересно! Расскажи подробнее 🤔',
      'Я тебя услышала: "' + userText + '"',
      'Принято! Что делаем дальше?'
    ];
    return answers[Math.floor(Math.random() * answers.length)];
  }

  // ============================================================
  // ОЗВУЧКА ОТВЕТА
  // ============================================================
  function speak(text) {
    if (!('speechSynthesis' in window)) return;

    try {
      window.speechSynthesis.cancel();
      var utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'ru-RU';
      utterance.rate = 1.05;
      utterance.pitch = 1.1;
      utterance.volume = 1;
      window.speechSynthesis.speak(utterance);
    } catch (e) {
      console.warn('Озвучка недоступна:', e);
    }
  }

  // ============================================================
  // РУЧНОЙ ВВОД (фолбэк)
  // ============================================================
  function showManualInput(message) {
    document.getElementById('listeningIndicator').classList.remove('active');

    var wrap = document.getElementById('manualWrap');
    wrap.classList.add('active');

    var input = document.getElementById('manualInput');
    input.placeholder = message || 'Напиши здесь...';
    input.focus();

    console.log('📝 Ручной ввод:', message);
  }

  function sendManual() {
    var input = document.getElementById('manualInput');
    var text = input.value.trim();
    if (!text) return;

    input.value = '';
    document.getElementById('manualWrap').classList.remove('active');

    handleUserSpeech(text);
  }

  document.getElementById('manualInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') sendManual();
  });

  // ============================================================
  // ЗАКРЫТИЕ
  // ============================================================
  function closeAll() {
    document.getElementById('frame').classList.remove('active');
    document.getElementById('bottomPanel').classList.remove('active');
    document.getElementById('centerLogo').classList.remove('hidden');

    setTimeout(function() {
      document.getElementById('userBubble').style.display = 'none';
      document.getElementById('botBubble').style.display = 'none';
      isProcessing = false;
    }, 400);
  }

  // Тап по экрану — закрыть, если открыто
  document.addEventListener('click', function(e) {
    if (isProcessing && !e.target.closest('.manual-wrap') && !e.target.closest('.start-btn')) {
      closeAll();
    }
  });

  // ============================================================
  // ИНИЦИАЛИЗАЦИЯ
  // ============================================================
  console.log('🌊 LoLOS 27 — Liquid Loll');
  console.log('📳 Нажми "Активировать" и тряхни телефон');
</script>
</body>
</html>
