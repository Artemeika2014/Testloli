<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LoLOS 27 — Liquid Loll</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: #1a1a2e !important;
    height: 100%;
    width: 100%;
    overflow: hidden !important;
    overscroll-behavior: none !important;
    touch-action: manipulation;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
    color: #fff;
    background: linear-gradient(135deg, #2a2a35 0%, #3a3a45 50%, #2a2a35 100%) !important;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 20px;
    position: relative;
  }

  .island-container {
    position: fixed;
    top: calc(env(safe-area-inset-top, 47px) - 38px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 1000;
    display: flex;
    justify-content: center;
    pointer-events: none;
  }

  .island {
    position: relative;
    width: 126px;
    height: 37px;
    background: #000;
    border-radius: 20px;
    overflow: hidden;
    transition: all 0.55s cubic-bezier(0.34, 1.2, 0.64, 1);
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .island.active {
    width: 340px;
    height: 340px;
    border-radius: 50%;
  }
  .island.expanded {
    width: 92vw;
    max-width: 440px;
    height: auto;
    min-height: 180px;
    border-radius: 48px;
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .island-wave {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg,
      #7b5ea7 0%, #a78bfa 20%, #feca57 45%,
      #feca57 55%, #a78bfa 80%, #7b5ea7 100%);
    background-size: 100% 300%;
    animation: waveUpDown 3s ease-in-out infinite;
    opacity: 0;
    transition: opacity 0.5s ease;
    z-index: 1;
    border-radius: inherit;
  }
  .island.active .island-wave,
  .island.expanded .island-wave { opacity: 0.85; }

  @keyframes waveUpDown {
    0%   { background-position: 50% 0%; }
    50%  { background-position: 50% 100%; }
    100% { background-position: 50% 0%; }
  }

  .island-gloss {
    position: absolute;
    top: 8%; left: 50%;
    transform: translateX(-50%);
    width: 70%; height: 30%;
    background: radial-gradient(ellipse at center,
      rgba(255,255,255,0.6) 0%,
      rgba(255,255,255,0.2) 30%,
      transparent 70%);
    filter: blur(12px);
    opacity: 0;
    transition: opacity 0.5s;
    z-index: 3;
    pointer-events: none;
  }
  .island.active .island-gloss,
  .island.expanded .island-gloss { opacity: 1; }

  .island-shadow {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 120%,
      rgba(0,0,0,0.8) 0%, transparent 60%);
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.5s;
  }
  .island.active .island-shadow,
  .island.expanded .island-shadow { opacity: 0.7; }

  .island-content {
    position: relative;
    z-index: 4;
    display: none;
    width: 100%;
    text-align: center;
  }
  .island.expanded .island-content { display: block; }

  .island-status {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
    margin-bottom: 12px;
  }
  .island-status.listening::after {
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    background: #fff;
    border-radius: 50%;
    margin-left: 8px;
    animation: dotPulse 1s ease-in-out infinite;
  }
  @keyframes dotPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(1.4); }
  }

  .island-response {
    font-size: 1rem;
    line-height: 1.5;
    color: #fff;
    font-weight: 500;
    min-height: 24px;
    word-wrap: break-word;
  }

  .island-mic {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    font-size: 3rem;
    opacity: 0;
    transition: opacity 0.4s;
    color: #fff;
  }
  .island.active .island-mic {
    opacity: 0.9;
    animation: micPulse 1.5s ease-in-out infinite;
  }
  .island.expanded .island-mic { opacity: 0; }

  @keyframes micPulse {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.1); opacity: 0.6; }
  }

  .main {
    text-align: center;
    max-width: 440px;
    width: 100%;
    position: relative;
    z-index: 1;
  }

  .logo {
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #a78bfa, #feca57);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
  }

  .subtitle {
    font-size: 0.75rem;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.4);
    margin-bottom: 20px;
  }

  .auto-detect {
    background: rgba(76,175,80,0.1);
    border: 1px solid rgba(76,175,80,0.3);
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 14px;
    font-size: 0.8rem;
    color: #4CAF50;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .auto-detect .detected-name { font-weight: 600; }
  .auto-detect button {
    background: rgba(76,175,80,0.2);
    border: 1px solid rgba(76,175,80,0.4);
    color: #4CAF50;
    padding: 6px 12px;
    border-radius: 10px;
    font-size: 0.7rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }

  .device-card {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 20px 16px;
    margin-bottom: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  }

  .device-card h3 {
    font-size: 0.8rem;
    font-weight: 600;
    margin-bottom: 14px;
    color: rgba(255,255,255,0.7);
    letter-spacing: 1px;
    text-transform: uppercase;
    text-align: left;
  }

  .device-options {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 320px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding-right: 4px;
  }
  .device-options::-webkit-scrollbar { width: 3px; }
  .device-options::-webkit-scrollbar-thumb {
    background: rgba(167,139,250,0.3);
    border-radius: 10px;
  }

  .device-group { margin-bottom: 6px; }
  .device-group-label {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(167,139,250,0.8);
    padding: 8px 4px 4px;
    text-align: left;
  }

  .device-option {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 12px 16px;
    cursor: pointer;
    transition: all 0.25s;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.9rem;
    color: #fff;
    text-align: left;
    gap: 10px;
  }
  .device-option:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(167,139,250,0.4);
  }
  .device-option.selected {
    background: rgba(167,139,250,0.15);
    border-color: #a78bfa;
    box-shadow: 0 0 20px rgba(167,139,250,0.2);
  }
  .device-option .name { font-weight: 500; flex: 1; }
  .device-option .badge {
    font-size: 0.6rem;
    padding: 3px 9px;
    border-radius: 20px;
    font-weight: 700;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .device-option .badge.supported {
    background: rgba(76,175,80,0.2);
    color: #4CAF50;
  }
  .device-option .badge.unsupported {
    background: rgba(255,107,107,0.15);
    color: #ff6b6b;
  }

  .btn {
    width: 100%;
    padding: 16px 24px;
    border: none;
    border-radius: 16px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    font-family: inherit;
    margin-bottom: 10px;
  }
  .btn-primary {
    background: linear-gradient(135deg, #7b5ea7, #a78bfa);
    color: #fff;
    box-shadow: 0 8px 30px rgba(123,94,167,0.4);
  }
  .btn-primary:active { transform: scale(0.97); }
  .btn-secondary {
    background: rgba(255,255,255,0.08);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.12);
  }
  .btn-secondary:active { transform: scale(0.97); }

  .hint {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.4);
    line-height: 1.6;
    margin-top: 12px;
    text-align: center;
  }
  .hint.error { color: #ff6b6b; }
  .hint.success { color: #4CAF50; }

  .hidden { display: none !important; }

  .manual-input {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-size: 1rem;
    font-family: inherit;
    outline: none;
  }
  .manual-input:focus { border-color: #a78bfa; }
</style>
</head>
<body>

<div class="island-container">
  <div class="island" id="island">
    <div class="island-wave"></div>
    <div class="island-shadow"></div>
    <div class="island-gloss"></div>
    <div class="island-mic">🎤</div>
    <div class="island-content" id="islandContent">
      <div class="island-status" id="islandStatus">Слушаю</div>
      <div class="island-response" id="islandResponse"></div>
    </div>
  </div>
</div>

<div class="main">
  <div class="logo">LoLOS 27</div>
  <div class="subtitle">Liquid Loll</div>

  <div class="auto-detect hidden" id="autoDetect">
    <span>Обнаружено: <span class="detected-name" id="detectedName">—</span></span>
    <button onclick="applyAutoDetect()">Применить</button>
  </div>

  <div class="device-card" id="step1">
    <h3>📱 Выбери свой iPhone</h3>
    <div class="device-options" id="deviceList">
      <div style="text-align:center;padding:20px;opacity:0.5;">Загрузка...</div>
    </div>
  </div>

  <div class="device-card hidden" id="step2">
    <h3>📳 Вызов ассистента</h3>
    <p style="font-size:0.85rem;opacity:0.6;margin-bottom:16px;line-height:1.5;text-align:left;">
      Нажми кнопку, разреши доступ к датчикам движения, и тряхни телефон.
    </p>
    <button class="btn btn-primary" id="enableBtn" onclick="enableMotion()">
      📳 Включить вызов
    </button>
    <button class="btn btn-secondary hidden" id="disableBtn" onclick="disableMotion()">
      ✖ Отключить
    </button>
    <div class="hint" id="hintText">Разреши доступ к датчикам движения</div>
  </div>

  <div class="device-card hidden" id="step3">
    <h3>🎤 Тест ассистента</h3>
    <p style="font-size:0.85rem;opacity:0.6;margin-bottom:16px;line-height:1.5;text-align:left;">
      Тряхни телефон или нажми кнопку ниже.
    </p>
    <button class="btn btn-primary" onclick="triggerAssistant()">
      🎤 Вызвать ассистента
    </button>
    <input type="text" id="manualInput" class="manual-input" placeholder="Или напиши здесь...">
    <button class="btn btn-secondary" onclick="sendManual()" style="margin-top:10px;">
      ➤ Отправить
    </button>
  </div>
</div>

<script>
// ============================================================
// СПРАВОЧНИК УСТРОЙСТВ
// ============================================================
var DEVICE_DATABASE = [
  { model: '17',        name: 'iPhone 17',                 w: 402, h: 874, supported: true, year: 2025 },
  { model: '17pro',     name: 'iPhone 17 Pro',             w: 402, h: 874, supported: true, year: 2025 },
  { model: '17promax',  name: 'iPhone 17 Pro Max',         w: 440, h: 956, supported: true, year: 2025 },
  { model: 'air',       name: 'iPhone Air',                w: 420, h: 912, supported: true, year: 2025 },
  { model: '16',        name: 'iPhone 16 / 16 Plus',       w: 393, h: 852, supported: true, year: 2024 },
  { model: '16pro',     name: 'iPhone 16 Pro / Pro Max',   w: 402, h: 874, supported: true, year: 2024 },
  { model: '16e',       name: 'iPhone 16e',                w: 390, h: 844, supported: false, year: 2024 },
  { model: '15',        name: 'iPhone 15 / 15 Plus',       w: 393, h: 852, supported: true, year: 2023 },
  { model: '15pro',     name: 'iPhone 15 Pro',             w: 393, h: 852, supported: true, year: 2023 },
  { model: '15promax',  name: 'iPhone 15 Pro Max',         w: 430, h: 932, supported: true, year: 2023 },
  { model: '14pro',     name: 'iPhone 14 Pro',             w: 393, h: 852, supported: true, year: 2022 },
  { model: '14promax',  name: 'iPhone 14 Pro Max',         w: 430, h: 932, supported: true, year: 2022 }
];

// ============================================================
// РЕНДЕР СПИСКА — вызывается сразу, не ждёт load
// ============================================================
function renderDeviceList() {
  try {
    var list = document.getElementById('deviceList');
    if (!list) {
      console.error('❌ deviceList не найден');
      return;
    }

    var groups = {};
    for (var i = 0; i < DEVICE_DATABASE.length; i++) {
      var d = DEVICE_DATABASE[i];
      if (!groups[d.year]) groups[d.year] = [];
      groups[d.year].push(d);
    }

    var years = Object.keys(groups).sort(function(a, b) { return b - a; });
    var html = '';

    for (var y = 0; y < years.length; y++) {
      var year = years[y];
      html += '<div class="device-group">';
      html += '<div class="device-group-label">iPhone ' + year + '</div>';

      for (var j = 0; j < groups[year].length; j++) {
        var dev = groups[year][j];
        var badge = dev.supported
          ? '<span class="badge supported">✓ Dynamic Island</span>'
          : '<span class="badge unsupported">✗ Без острова</span>';

        html += '<div class="device-option" data-model="' + dev.model + '" onclick="selectDevice(\'' + dev.model + '\', this)">';
        html += '<span class="name">' + dev.name + '</span>';
        html += badge;
        html += '</div>';
      }
      html += '</div>';
    }

    html += '<div class="device-group">';
    html += '<div class="device-group-label">Другое</div>';
    html += '<div class="device-option" data-model="other" onclick="selectDevice(\'other\', this)">';
    html += '<span class="name">Другой iPhone</span>';
    html += '<span class="badge unsupported">✗ Без острова</span>';
    html += '</div></div>';

    list.innerHTML = html;
    console.log('✅ Список устройств отрендерен:', years.length, 'групп');
  } catch (e) {
    console.error('❌ Ошибка рендера списка:', e);
  }
}

// ============================================================
// СОСТОЯНИЕ
// ============================================================
var selectedDevice = null;
var deviceSupported = false;
var motionEnabled = false;
var shakeDetected = false;
var lastX = 0, lastY = 0, lastZ = 0;
var lastShakeTime = 0;
var SHAKE_THRESHOLD = 18;

// ============================================================
// АВТООПРЕДЕЛЕНИЕ
// ============================================================
function autoDetectDevice() {
  try {
    var sw = window.screen.width;
    var sh = window.screen.height;
    var isIPhone = /iPhone/.test(navigator.userAgent) ||
                   (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (!isIPhone) return null;

    for (var i = 0; i < DEVICE_DATABASE.length; i++) {
      if (DEVICE_DATABASE[i].w === sw && DEVICE_DATABASE[i].h === sh) {
        return DEVICE_DATABASE[i];
      }
    }
    return { model: 'unknown', name: 'iPhone (' + sw + '×' + sh + ')', supported: false };
  } catch (e) {
    console.error('❌ Ошибка автоопределения:', e);
    return null;
  }
}

function applyAutoDetect() {
  var info = autoDetectDevice();
  if (!info) return;
  var el = document.querySelector('.device-option[data-model="' + info.model + '"]');
  if (el) {
    selectDevice(info.model, el);
  } else {
    var other = document.querySelector('.device-option[data-model="other"]');
    if (other) selectDevice('other', other);
  }
}

// ============================================================
// ВЫБОР УСТРОЙСТВА
// ============================================================
function selectDevice(model, el) {
  var all = document.querySelectorAll('.device-option');
  for (var i = 0; i < all.length; i++) all[i].classList.remove('selected');
  if (el) el.classList.add('selected');

  selectedDevice = model;

  var supportedModels = ['17', '17pro', '17promax', 'air', '16', '16pro',
                         '15', '15pro', '15promax', '14pro', '14promax'];
  deviceSupported = supportedModels.indexOf(model) !== -1;

  var autoEl = document.getElementById('autoDetect');
  if (autoEl) autoEl.classList.add('hidden');

  setTimeout(function() {
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');
    document.getElementById('step3').classList.remove('hidden');

    if (deviceSupported) {
      updateHint('✅ Устройство поддерживает Dynamic Island. Нажми кнопку ниже.', 'success');
    } else {
      updateHint('⚠️ Устройство не поддерживает Dynamic Island, но можно протестировать.', 'error');
    }
  }, 200);
}

// ============================================================
// ДАТЧИКИ
// ============================================================
async function enableMotion() {
  if (typeof DeviceMotionEvent === 'undefined') {
    updateHint('❌ Браузер не поддерживает датчики движения', 'error');
    return;
  }
  if (typeof DeviceMotionEvent.requestPermission === 'function') {
    try {
      var permission = await DeviceMotionEvent.requestPermission();
      if (permission !== 'granted') {
        updateHint('❌ Доступ к датчикам отклонён', 'error');
        return;
      }
    } catch (e) {
      updateHint('❌ Ошибка: ' + e.message, 'error');
      return;
    }
  }
  window.addEventListener('devicemotion', onMotion);
  motionEnabled = true;
  document.getElementById('enableBtn').classList.add('hidden');
  document.getElementById('disableBtn').classList.remove('hidden');
  updateHint('✅ Датчики активны! Тряхни телефон.', 'success');
}

function disableMotion() {
  window.removeEventListener('devicemotion', onMotion);
  motionEnabled = false;
  document.getElementById('enableBtn').classList.remove('hidden');
  document.getElementById('disableBtn').classList.add('hidden');
  closeIsland();
  updateHint('Датчики отключены.');
}

function onMotion(event) {
  if (!motionEnabled) return;
  var acc = event.accelerationIncludingGravity;
  if (!acc) return;
  var x = acc.x || 0, y = acc.y || 0, z = acc.z || 0;
  var delta = Math.abs(x - lastX) + Math.abs(y - lastY) + Math.abs(z - lastZ);
  lastX = x; lastY = y; lastZ = z;
  if (delta > SHAKE_THRESHOLD) {
    var now = Date.now();
    if (now - lastShakeTime > 1500) {
      lastShakeTime = now;
      triggerAssistant();
    }
  }
}

function updateHint(text, type) {
  var el = document.getElementById('hintText');
  if (!el) return;
  el.textContent = text;
  el.className = 'hint' + (type ? ' ' + type : '');
}

// ============================================================
// АССИСТЕНТ
// ============================================================
function triggerAssistant() {
  if (shakeDetected) return;
  shakeDetected = true;
  openIsland('🎤 Слушаю...');
  startRecognition();
}

function openIsland(text) {
  var island = document.getElementById('island');
  var status = document.getElementById('islandStatus');
  var response = document.getElementById('islandResponse');
  island.classList.add('active');
  status.textContent = 'Слушаю';
  status.classList.add('listening');
  response.textContent = text;
  setTimeout(function() { island.classList.add('expanded'); }, 250);
}

function closeIsland() {
  var island = document.getElementById('island');
  island.classList.remove('expanded');
  island.classList.remove('active');
  shakeDetected = false;
  document.getElementById('islandStatus').classList.remove('listening');
}

function setResponse(text) {
  document.getElementById('islandStatus').textContent = 'Ответ';
  document.getElementById('islandStatus').classList.remove('listening');
  document.getElementById('islandResponse').textContent = text;
}

async function startRecognition() {
  try {
    var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      var recognition = new SpeechRecognition();
      recognition.lang = 'ru-RU';
      recognition.interimResults = false;
      recognition.continuous = false;
      recognition.onresult = function(event) {
        var transcript = event.results[0][0].transcript;
        setResponse('Ты сказал: "' + transcript + '"');
        stream.getTracks().forEach(function(t) { t.stop(); });
        setTimeout(closeIsland, 4000);
      };
      recognition.onerror = function(event) {
        stream.getTracks().forEach(function(t) { t.stop(); });
        handleRecognitionError(event.error);
      };
      try { recognition.start(); return; }
      catch (e) { handleRecognitionError(e.message); stream.getTracks().forEach(function(t) { t.stop(); }); }
    } else {
      stream.getTracks().forEach(function(t) { t.stop(); });
      handleRecognitionError('not-supported');
    }
  } catch (e) {
    setResponse('🎤 Напиши текст в поле ниже');
    setTimeout(closeIsland, 3000);
  }
}

function handleRecognitionError(error) {
  if (error === 'service-not-allowed') setResponse('⚠️ Микрофон недоступен. Используй поле ниже.');
  else if (error === 'not-allowed') setResponse('⚠️ Нет доступа к микрофону.');
  else if (error === 'no-speech') setResponse('🤔 Ничего не услышал.');
  else setResponse('❌ Ошибка: ' + error);
  setTimeout(closeIsland, 3500);
}

function sendManual() {
  var input = document.getElementById('manualInput');
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  openIsland('💬 "' + text + '"');
  setTimeout(function() {
    setResponse('Привет! Я LoLi, слышу тебя: "' + text + '". Чем помочь?');
  }, 800);
  setTimeout(closeIsland, 5000);
}

// ============================================================
// СОБЫТИЯ
// ============================================================
document.getElementById('manualInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendManual();
});

document.addEventListener('click', function(e) {
  var island = document.getElementById('island');
  if (island.classList.contains('expanded') && !island.contains(e.target)) {
    closeIsland();
  }
});

// ============================================================
// ЗАПУСК — рендер сразу, не ждём load
// ============================================================
(function init() {
  console.log('🌊 LoLOS 27 — Liquid Loll');

  // Рендерим список сразу
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', renderDeviceList);
  } else {
    renderDeviceList();
  }

  // Автоопределение
  function tryAutoDetect() {
    var detected = autoDetectDevice();
    if (detected) {
      var autoEl = document.getElementById('autoDetect');
      var nameEl = document.getElementById('detectedName');
      if (autoEl && nameEl) {
        autoEl.classList.remove('hidden');
        nameEl.textContent = detected.name + (detected.model === 'unknown' ? ' (не точно)' : '');
        window._autoDetected = detected;
      }
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', tryAutoDetect);
  } else {
    tryAutoDetect();
  }
})();
</script>
